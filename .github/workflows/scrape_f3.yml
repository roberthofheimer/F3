name: Scrape F3 Stats

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC (adjust as needed)
  workflow_dispatch: # Allows you to run it manually anytime from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread google-auth
          playwright install --with-deps chromium

      - name: Create credentials file from GitHub Secret
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > credentials.json

      - name: Run scraper script
        run: python scraper.py
