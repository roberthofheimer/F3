name: Update Shipyard 112 feed

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-extra fonts-liberation
          pip install duckdb pillow
      - name: Build feed and image
        env:
          PAX: Shipyard
        run: python build_feed.py docs/shipyard.json
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/shipyard.json docs/shipyard.png
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update Shipyard 112 feed"
            git push
          fi
