name: Update Shipyard 112 picture

on:
  schedule:
    - cron: "0 * * * *"    # every hour, on the hour (GitHub often starts these a few minutes late)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-extra fonts-liberation
          pip install duckdb pillow
      - name: Draw the picture
        env:
          PAX: Shipyard
        run: python build_feed.py docs/shipyard.png
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git rm -q --ignore-unmatch docs/shipyard.json   # the old JSON file is no longer used
          git add docs/shipyard.png
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update Shipyard 112 picture"
            git push
          fi
